baseURL: https://naturalis-balance.com/
locale: de-DE
title: Naturalis Balance
theme: stack

pagination:
  pagerSize: 10

params:
  mainSections:
    - post
  rssFullContent: true

  footer:
    since: 2026

  dateFormat:
    published: "02.01.2006"
    lastUpdated: "02.01.2006"

  sidebar:
    compact: false
    emoji: "🌿"
    subtitle: Naturalis Balance Blog
    avatar: ""

  article:
    headingAnchor: false
    math: false
    toc: true
    readingTime: true
    list:
      showTags: true
    license:
      enabled: false

  colorScheme:
    toggle: true
    default: auto

  comments:
    enabled: false

  widgets:
    homepage:
      - type: about
        params:
          title: "Über Naturalis Balance"
          description: "Ein Ort für Inspiration, Achtsamkeit und natürliche Wege zu einem ausgeglichenen Leben."
          aboutUrl: "/about/"
          buttonText: "Mehr über mich"
      - type: recent-posts
        params:
          limit: 3
          title: "Neueste Beiträge"
    page:
      - type: toc

menu:
  main:
    - identifier: blog
      name: Blog
      url: /
      weight: 1
    - identifier: about
      name: Über mich
      url: /about/
      weight: 2
    - identifier: natur
      name: Natur
      url: /categories/natur-balance/
      weight: 3
    - identifier: balance
      name: Balance
      url: /categories/natur-balance/
      weight: 4
    - identifier: kontakt
      name: Kontakt
      url: /about/
      weight: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON
